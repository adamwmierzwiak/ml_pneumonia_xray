services:
  chestxray:
    build: .
    image: chestxray:latest
    container_name: chestxray
    # Port tylko na localhost — dlatego token jest wyłączony
    # 18888 na hoście, żeby nie kolidować z popularnym 8888
    ports:
      - "127.0.0.1:18888:8888"
    volumes:
      - .:/app
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --IdentityProvider.token=''
      --ServerApp.root_dir=/app

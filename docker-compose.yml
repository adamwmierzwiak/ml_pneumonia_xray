services:
  chestxray:
    build: .
    image: chestxray:latest
    container_name: chestxray
    # Bound to localhost only — that's why the auth token is disabled
    # Host port 18888, to avoid colliding with the common default 8888
    ports:
      - "127.0.0.1:18888:8888"
    volumes:
      - .:/app
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --IdentityProvider.token=''
      --ServerApp.root_dir=/app
